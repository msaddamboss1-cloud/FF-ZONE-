    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyA8jX_M4iqwdMm-RP10CUjd664GZrnrmQA",
            authDomain: "rz-mod-menu.firebaseapp.com",
            databaseURL: "https://rz-mod-menu-default-rtdb.firebaseio.com",
            projectId: "rz-mod-menu",
            storageBucket: "rz-mod-menu.firebasestorage.app",
            messagingSenderId: "426988321516",
            appId: "1:426988321516:web:33c8fd9492ee0ad58b03c9",
            measurementId: "G-EDC9TH795S"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        let allMatchesData = [];

        // ১. ফায়ারবেস থেকে ডাটা লোড
        async function loadMatchesFromFirebase() {
            allMatchesData = [];

            try {
                // Firestore Check
                const querySnapshot = await getDocs(collection(db, "matches"));
                if (!querySnapshot.empty) {
                    querySnapshot.forEach((doc) => {
                        allMatchesData.push({ id: doc.id, ...doc.data() });
                    });
                    window.allMatchesData = allMatchesData;
                    filterMatches();
                    return;
                }
            } catch (err) {
                console.log("Firestore fetch error/empty:", err);
            }

            // Realtime Database Check
            const matchesRef = ref(rtdb, 'matches');
            onValue(matchesRef, (snapshot) => {
                const data = snapshot.val();
                allMatchesData = [];
                if (data) {
                    if (Array.isArray(data)) {
                        allMatchesData = data.filter(item => item !== null);
                    } else {
                        Object.keys(data).forEach(key => {
                            allMatchesData.push({ id: key, ...data[key] });
                        });
                    }
                }
                window.allMatchesData = allMatchesData;
                filterMatches();
            }, (error) => {
                console.error("RTDB error:", error);
                window.allMatchesData = [];
                filterMatches();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadMatchesFromFirebase();
        });
    </script>

    <script>
        // লোগো পপ-আপ হ্যান্ডলার
        const logoBtn = document.getElementById('main-logo-btn');
        const logoModal = document.getElementById('logo-modal');

        logoBtn.addEventListener('click', () => {
            logoModal.classList.add('active');
        });

        logoModal.addEventListener('click', () => {
            logoModal.classList.remove('active');
        });

        // ফিল্টারিং লজিক (BR Mode Fix সহ)
        let currentMainMode = 'ALL';
        let currentSubMode = 'ALL';

        function selectMainMode(mode, element) {
            currentMainMode = mode;
            currentSubMode = 'ALL';

            document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('cs-sub-filters').style.display = 'none';
            document.getElementById('lonewolf-sub-filters').style.display = 'none';

            if (mode === 'CS') {
                document.getElementById('cs-sub-filters').style.display = 'flex';
                resetSubChips('cs-sub-filters');
            } else if (mode === 'LONE_WOLF') {
                document.getElementById('lonewolf-sub-filters').style.display = 'flex';
                resetSubChips('lonewolf-sub-filters');
            }

            filterMatches();
        }

        function selectSubMode(subMode, element) {
            currentSubMode = subMode;

            let parent = element.parentElement;
            parent.querySelectorAll('.sub-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            filterMatches();
        }

        function resetSubChips(containerId) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.sub-chip').forEach((el, idx) => {
                if (idx === 0) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        // ফিল্টার ফাংশন (Smart matching for BR and other modes)
        function filterMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = "";

            let matches = window.allMatchesData || [];

            if (currentMainMode !== 'ALL') {
                matches = matches.filter(m => {
                    const modeStr = (m.mode || '').toString().toUpperCase().trim();
                    if (currentMainMode === 'BR') {
                        return modeStr === 'BR' || modeStr.includes('BR');
                    } else if (currentMainMode === 'CS') {
                        return modeStr === 'CS' || modeStr.includes('CS');
                    } else if (currentMainMode === 'LONE_WOLF') {
                        return modeStr === 'LONE_WOLF' || modeStr.includes('LONE') || modeStr.includes('WOLF');
                    } else if (currentMainMode === 'FUNNY') {
                        return modeStr === 'FUNNY' || modeStr.includes('FUNNY');
                    }
                    return modeStr === currentMainMode;
                });
            }

            if (currentSubMode !== 'ALL') {
                matches = matches.filter(m => {
                    const subModeStr = (m.subMode || '').toString().toLowerCase().trim();
                    return subModeStr === currentSubMode.toLowerCase();
                });
            }

            if (matches.length === 0) {
                container.innerHTML = `<div class="no-matches"><i class="fa-solid fa-ghost" style="font-size: 24px; margin-bottom: 8px;"></i><br>বর্তমানে এই ক্যাটাগরিতে কোনো ম্যাচ উপলোদ্ধ নেই!</div>`;
                return;
            }

            matches.forEach(m => renderMatchCard(container, m));
        }

        // ডায়নামিক ম্যাচ কার্ড রেন্ডারিং (Null Value Removal & Dynamic ID Handling)
        function renderMatchCard(container, match) {
            // ডায়নামিক প্রাইজ লিস্ট চেক
            let prizesList = [];
            if (Array.isArray(match.prizes)) {
                prizesList = match.prizes;
            } else if (typeof match.prizes === 'object' && match.prizes !== null) {
                prizesList = Object.values(match.prizes);
            }

            // ডায়নামিক ম্যাচ আইডি
            const matchDisplayNo = match.matchNo || match.matchId || (match.id ? `#MATCH-${match.id.substring(0, 6)}` : '#MATCH');

            const cardHTML = `
                <div class="match-card">
                    <div class="card-top-bar">
                        <div class="match-badge">${matchDisplayNo}</div>
                        <div class="map-badge">
                            <i class="fa-solid fa-map-location-dot"></i> ${match.mapName || 'BERMUDA'}
                        </div>
                    </div>

                    <div class="card-title-row">
                        <div class="match-name">${match.title || 'BR MATCH'}</div>
                        <div class="mode-tag">${match.subMode ? (match.mode || 'BR') + ' ' + match.subMode.toUpperCase() : (match.mode || 'BR') + ' MODE'}</div>
                    </div>

                    ${match.time ? `
                    <div class="match-time">
                        <i class="fa-regular fa-clock"></i> ${match.time}
                    </div>` : ''}

                    <div class="fees-container">
                        <div class="fee-box entry-box">
                            <span class="fee-label"><i class="fa-solid fa-ticket"></i> এন্ট্রি ফি</span>
                            <span class="fee-value">৳ ${match.entryFee || '0'}</span>
                        </div>
                        <div class="fee-box kill-box">
                            <span class="fee-label"><i class="fa-solid fa-crosshairs"></i> পার কিল</span>
                            <span class="fee-value">${match.perKill ? '৳ ' + match.perKill : 'N/A'}</span>
                        </div>
                    </div>

                    ${prizesList.length > 0 ? `
                    <div class="prize-box">
                        <div class="prize-header">
                            <i class="fa-solid fa-trophy"></i> প্রাইজ ডিস্ট্রিবিউশন:
                        </div>
                        <div class="prize-grid">
                            ${prizesList.map(p => `
                                <div class="prize-item">
                                    <span class="label">${p.rank || p.position || 'প্রাইজ'}</span>
                                    <span class="amount">৳ ${p.amount || p.prize || '0'}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    <div class="slot-section">
                        <div class="slot-text">
                            <span>স্লট বুকিং</span>
                            <span>${match.bookedSlots || 0} / ${match.totalSlots || 48} জন</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${Math.min(100, ((match.bookedSlots || 0) / (match.totalSlots || 48)) * 100)}%;"></div>
                        </div>
                    </div>

                    <a href="match-details.html?id=${match.id}" class="btn-join">
                        <i class="fa-solid fa-shield-halved"></i> জয়েন করুন
                    </a>
                </div>
            `;
            container.innerHTML += cardHTML;
        }
    </script>
</body>
</html>
