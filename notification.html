<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF ZONE - Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- OneSignal SDK Integration -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "38b4db47-c5c2-4bb5-a56c-4bca3f708444",
        });
      });
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #090d16; color: #fff; max-width: 500px; margin: 0 auto; padding: 15px; }
        .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #1f2a3e; margin-bottom: 15px; }
        .notif-card { background: #141a26; border: 1px solid #1f2a3e; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
        .notif-title { color: #00e5ff; font-weight: bold; font-size: 16px; margin-bottom: 6px; }
        .notif-body { color: #d1d5db; font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
        
        .room-box { background: #0d111a; padding: 12px; border-radius: 8px; border: 1px solid #00e5ff; margin-top: 10px; }
        .room-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .room-row:last-child { margin-bottom: 0; }
        .copy-btn { background: #ff2a6d; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fa-solid fa-bell"></i> FF ZONE নোটিফিকেশন</h2>
    </div>

    <div id="notif-list">
        <p style="text-align: center; color: #888; margin-top: 20px;">লোড হচ্ছে...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA8jX_M4iqwdMm-RP10CUjd664GZrnrmQA",
          authDomain: "rz-mod-menu.firebaseapp.com",
          databaseURL: "https://rz-mod-menu-default-rtdb.firebaseio.com",
          projectId: "rz-mod-menu",
          storageBucket: "rz-mod-menu.firebasestorage.app",
          messagingSenderId: "426988321516",
          appId: "1:426988321516:web:33c8fd9492ee0ad58b03c9",
          measurementId: "G-EDC9TH795S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // টেক্সট কপি করার ফাংশন
        window.copyText = function(text) {
            navigator.clipboard.writeText(text);
            alert("কপি করা হয়েছে: " + text);
        };

        // রিয়েলটাইম লিস্ট লোড
        const q = query(collection(db, "notifications"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('notif-list');
            list.innerHTML = '';

            if(snapshot.empty) {
                list.innerHTML = '<p style="text-align: center; color: #888; margin-top: 20px;">কোনো নোটিফিকেশন নেই</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'notif-card';
                
                let roomHTML = '';
                if(data.hasRoomDetails) {
                    roomHTML = `
                        <div class="room-box">
                            <div class="room-row">
                                <span style="color:#00e5ff;"><b>Room ID:</b> ${data.roomId}</span>
                                <button class="copy-btn" onclick="copyText('${data.roomId}')">Copy ID</button>
                            </div>
                            <div class="room-row">
                                <span style="color:#ff2a6d;"><b>Password:</b> ${data.roomPass}</span>
                                <button class="copy-btn" onclick="copyText('${data.roomPass}')">Copy Pass</button>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="notif-title">${data.title}</div>
                    <div class="notif-body">${data.message}</div>
                    ${roomHTML}
                `;
                list.appendChild(card);
            });
        });
    </script>
</body>
</html>
