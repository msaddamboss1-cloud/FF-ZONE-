<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF ZONE - Account</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #08080a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Auto Login Loading Screen */
        #pageLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08080a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #00f0ff;
            font-size: 16px;
            font-weight: bold;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1f1f28;
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #111116;
            border: 1px solid #1f1f28;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: none; /* Auto-login check হওয়া পর্যন্ত লুকিয়ে রাখা হয়েছে */
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid #ff2e54;
            box-shadow: 0 0 15px rgba(255, 46, 84, 0.5);
            margin-bottom: 10px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff2e54, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 12px;
            color: #64748b;
            font-size: 13px;
        }

        .input-field {
            width: 100%;
            background: #08080a;
            border: 1px solid #252535;
            border-radius: 8px;
            padding: 11px 11px 11px 34px;
            color: #ffffff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #00f0ff;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-reg {
            background: linear-gradient(135deg, #ff2e54, #d90429);
            color: #ffffff;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 11px;
            margin: 16px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #222230;
        }

        .divider span {
            padding: 0 10px;
        }

        .google-btn {
            background: #181824;
            border: 1px solid #2e2e42;
            color: #ffffff;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .google-btn i {
            color: #ea4335;
            font-size: 16px;
        }

        .toggle-redirect {
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .toggle-redirect button {
            background: none;
            border: none;
            color: #ff2e54;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-left: 4px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Page Loading Screen (Auto-login checking) -->
    <div id="pageLoader">
        <div class="loader-spinner"></div>
        <span>যাচাই করা হচ্ছে...</span>
    </div>

    <div class="auth-container" id="authBox">
        
        <div class="brand-header">
            <img src="https://i.ibb.co.com/GD2TNhV/Screenshot-2026-08-30-14-09-34-700-com-google-android-apps-photos.png" alt="FF ZONE" class="brand-logo">
            <div class="brand-title" id="pageTitle">FF ZONE</div>
        </div>

        <!-- ==================== 1. LOGIN SECTION ==================== -->
        <div id="loginSection">
            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <label>ইমেইল বা মোবাইল নম্বর (Email / Phone)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginIdentifier" class="input-field" placeholder="ইমেইল অথবা মোবাইল নম্বর দিন" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>পাসওয়ার্ড (Password)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" class="input-field" placeholder="******" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="btnLoginSubmit">
                    <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
                </button>
            </form>

            <div class="divider">
                <span>অথবা সাইন-ইন করুন</span>
            </div>

            <!-- Google Login Button -->
            <button type="button" class="google-btn btn-google-action">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <!-- Toggle to Register Form -->
            <div class="toggle-redirect">
                একাউন্ট নেই? <button type="button" onclick="switchView('register')">নতুন করে একাউন্ট তৈরি করুন</button>
            </div>
        </div>


        <!-- ==================== 2. REGISTER SECTION ==================== -->
        <div id="registerSection" style="display: none;">
            <form id="registerForm" class="auth-form">
                <!-- Name -->
                <div class="input-group">
                    <label>আপনার নাম (Full Name)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" class="input-field" placeholder="আপনার নাম লিখুন" required>
                    </div>
                </div>

                <!-- FF Level -->
                <div class="input-group">
                    <label>ফ্রি ফায়ার লেভেল (FF Level)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-ranking-star"></i>
                        <input type="number" id="regLevel" class="input-field" placeholder="যেমন: 55" required min="1" max="100">
                    </div>
                </div>

                <!-- FF UID -->
                <div class="input-group">
                    <label>ফ্রি ফায়ার ইউআইডি (FF UID)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-gamepad"></i>
                        <input type="number" id="regUid" class="input-field" placeholder="যেমন: 8695277869" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label>ইমেইল এড্রেস (Email Address)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" class="input-field" placeholder="example@gmail.com" required>
                    </div>
                </div>

                <!-- Phone -->
                <div class="input-group">
                    <label>ফোন নম্বর (Phone Number)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="regPhone" class="input-field" placeholder="017XXXXXXXX" required pattern="[0-9]{11}">
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label>পাসওয়ার্ড (Password)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" class="input-field" placeholder="কমপক্ষে ৬ অক্ষর" required minlength="6">
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label>পাসওয়ার্ড নিশ্চিত করুন (Confirm Password)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="password" id="regConfirmPassword" class="input-field" placeholder="পাসওয়ার্ড পুনরায় দিন" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="submit-btn btn-reg" id="btnRegSubmit">
                    <i class="fa-solid fa-user-plus"></i> রেজিস্ট্রেশন সম্পন্ন করুন
                </button>
            </form>

            <div class="divider">
                <span>অথবা সাইন-আপ করুন</span>
            </div>

            <!-- Google Register/Sign-Up Button -->
            <button type="button" class="google-btn btn-google-action">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <!-- Toggle to Login Form -->
            <div class="toggle-redirect">
                ইতোমধ্যে একাউন্ট আছে? <button type="button" style="color:#00f0ff;" onclick="switchView('login')">লগইন করুন</button>
            </div>
        </div>

    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA8jX_M4iqwdMm-RP10CUjd664GZrnrmQA",
            authDomain: "rz-mod-menu.firebaseapp.com",
            databaseURL: "https://rz-mod-menu-default-rtdb.firebaseio.com",
            projectId: "rz-mod-menu",
            storageBucket: "rz-mod-menu.firebasestorage.app",
            messagingSenderId: "426988321516",
            appId: "1:426988321516:web:33c8fd9492ee0ad58b03c9",
            measurementId: "G-EDC9TH795S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ==================== AUTO LOGIN CHECK ====================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ইউজার আগে থেকেই লগইন অবস্থায় আছে, সরাসরি Dashboard এ নিয়ে যাওয়া হবে
                localStorage.setItem('userId', user.uid);
                window.location.href = "dashboard.html";
            } else {
                // ইউজার লগইন নেই, লগইন ফর্ম দেখানো হবে
                document.getElementById('pageLoader').style.display = 'none';
                document.getElementById('authBox').style.display = 'block';
            }
        });

        // --- Single Page View Switcher ---
        window.switchView = function(view) {
            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');
            const pageTitle = document.getElementById('pageTitle');

            if (view === 'register') {
                loginSection.style.display = 'none';
                registerSection.style.display = 'block';
                pageTitle.innerText = "CREATE ACCOUNT";
            } else {
                loginSection.style.display = 'block';
                registerSection.style.display = 'none';
                pageTitle.innerText = "FF ZONE";
            }
        };

        // --- 1. HANDLE LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            let identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLoginSubmit');

            btn.disabled = true;
            btn.innerText = "যাচাই করা হচ্ছে...";

            try {
                let emailToLogin = identifier;

                if (!identifier.includes('@')) {
                    const usersRef = ref(db, 'users');
                    const phoneQuery = query(usersRef, orderByChild('phone'), equalTo(identifier));
                    const snapshot = await get(phoneQuery);

                    if (snapshot.exists()) {
                        const userData = Object.values(snapshot.val())[0];
                        emailToLogin = userData.email;
                    } else {
                        throw new Error("phone-not-found");
                    }
                }

                await signInWithEmailAndPassword(auth, emailToLogin, password);

            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> লগইন করুন`;

                if (error.message === "phone-not-found") {
                    alert("⚠️ এই মোবাইল নম্বর দিয়ে কোনো একাউন্ট পাওয়া যায়নি!");
                } else {
                    alert("⚠️ ইমেইল/মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে!");
                }
            }
        });

        // --- 2. HANDLE REGISTER ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const level = document.getElementById('regLevel').value.trim();
            const ffuid = document.getElementById('regUid').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const btn = document.getElementById('btnRegSubmit');

            if (password !== confirmPassword) {
                alert("⚠️ দুই পাসওয়ার্ড মিলছে না! সঠিক পাসওয়ার্ড দিন।");
                return;
            }

            btn.disabled = true;
            btn.innerText = "প্রসেসিং হচ্ছে...";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Save User Info in DB
                await set(ref(db, 'users/' + user.uid), {
                    uid: user.uid,
                    name: name,
                    fflevel: level,
                    ffuid: ffuid,
                    email: email,
                    phone: phone,
                    balance: { deposit: 0, winning: 0 },
                    createdAt: new Date().toISOString()
                });

            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-user-plus"></i> রেজিস্ট্রেশন সম্পন্ন করুন`;

                if (error.code === 'auth/email-already-in-use') {
                    alert("⚠️ এই ইমেইল দিয়ে ইতোমধ্যে একাউন্ট খোলা রয়েছে!");
                } else {
                    alert("⚠️ সমস্যা হয়েছে: " + error.message);
                }
            }
        });

        // --- 3. HANDLE GOOGLE SIGN IN / SIGN UP ---
        const handleGoogleAuth = async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${user.uid}`));

                if (!snapshot.exists()) {
                    await set(ref(db, 'users/' + user.uid), {
                        uid: user.uid,
                        name: user.displayName || 'FF Gamer',
                        fflevel: '1',
                        ffuid: '00000000',
                        email: user.email,
                        phone: '',
                        balance: { deposit: 0, winning: 0 },
                        createdAt: new Date().toISOString()
                    });
                }

            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    alert("⚠️ গুগলের মাধ্যমে সাইন-ইন করতে সমস্যা হয়েছে: " + error.message);
                }
            }
        };

        document.querySelectorAll('.btn-google-action').forEach(btn => {
            btn.addEventListener('click', handleGoogleAuth);
        });
    </script>
</body>
  </html>
